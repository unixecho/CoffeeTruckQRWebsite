<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8e8d2" />
    <title>Coffee Truck 3D Prints</title>
    <link
      rel="preload"
      href="assets/fonts/rubik-hebrew.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="assets/fonts/rubik-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="lang-switcher" id="langSwitcher">
      <button
        id="langToggleBtn"
        class="lang-toggle"
        aria-label="Change language"
      >
        🌐
      </button>
      <div id="langMenu" class="lang-menu">
        <button class="lang-option" data-lang="he">עברית</button>
        <span class="lang-sep" aria-hidden="true"></span>
        <button class="lang-option" data-lang="en">English</button>
        <span class="lang-sep" aria-hidden="true"></span>
        <button class="lang-option" data-lang="ar">العربية</button>
      </div>
    </div>

    <div class="app-shell">
      <section id="landingView" class="landing-view">
        <div class="hero-bg-lines" aria-hidden="true"></div>
        <div class="hero-blob hero-blob-one" aria-hidden="true"></div>
        <div class="hero-blob hero-blob-two" aria-hidden="true"></div>

        <div class="hero-layout">
          <aside class="side-label" aria-hidden="true">
            <span></span>
            <p>3D Prints</p>
            <span></span>
          </aside>

          <div class="hero-copy">
            <p class="eyebrow spaced" id="landingEyebrow"></p>
            <h1 id="landingTitle"></h1>
            <p class="hero-text" id="landingText"></p>

            <div class="portal-actions">
              <button id="openStoreBtn" class="primary-btn"></button>
              <button
                id="onlineOrderingBtn"
                class="secondary-btn disabled-btn"
                disabled
              ></button>
              <button id="landingBitBtn" class="bit-btn"></button>
              <button id="suggestionBtn" class="suggest-btn"></button>
            </div>
          </div>

          <div class="hero-preview" aria-hidden="true">
            <div class="orange-disc"></div>
            <div class="phone-mockup">
              <div class="phone-notch"></div>
              <div class="phone-screen">
                <div class="phone-top-row">
                  <div>
                    <small>Hello,</small>
                    <strong>Welcome</strong>
                  </div>
                  <div class="mini-cart">🛒<span>3</span></div>
                </div>

                <div class="search-row">
                  <span>⌕</span>
                  <p>Search</p>
                  <b>☰</b>
                </div>

                <div class="phone-section-title">
                  <strong>Categories</strong>
                  <span>View All →</span>
                </div>

                <div class="mini-categories">
                  <div><i>🐉</i><span>Figures</span></div>
                  <div><i>⭐</i><span>Keys</span></div>
                  <div><i>🧲</i><span>Magnets</span></div>
                  <div><i>☕</i><span>Desk</span></div>
                </div>

                <div class="sale-card">
                  <div>
                    <strong>Fresh Prints</strong>
                    <span>Small gifts · Made local</span>
                  </div>
                  <b>3D</b>
                </div>

                <div class="phone-section-title">
                  <strong>Featured</strong>
                  <span>View All →</span>
                </div>

                <div class="mini-products">
                  <article>
                    <div class="mini-product-img">🐲</div>
                    <strong>Dragon</strong><span>₪35</span>
                  </article>
                  <article>
                    <div class="mini-product-img">🌀</div>
                    <strong>Fidget</strong><span>₪15</span>
                  </article>
                </div>
              </div>
            </div>

            <div class="bags" aria-hidden="true">
              <span class="bag blue"></span>
              <span class="bag red"></span>
              <span class="bag yellow"></span>
            </div>
          </div>
        </div>
      </section>

      <section id="storeView" class="store-view hidden">
        <div class="store-header-wrap">
          <div class="store-header-card">
            <button id="backToLandingBtn" class="back-btn" aria-label="Back">
              →
            </button>
            <div class="store-header-text">
              <p class="eyebrow" id="storeEyebrow"></p>
              <h2 class="store-main-title" id="storeTitle"></h2>
            </div>
            <button id="cartToggleBtn" class="cart-pill">
              <span id="cartLabel"></span>
              <span id="cartCount">0</span>
            </button>
          </div>
        </div>

        <div id="infoBanner" class="info-banner"></div>
        <div id="categoryFilters" class="category-filters"></div>
        <main id="productsGrid" class="products-grid"></main>
      </section>

      <aside id="cartDrawer" class="cart-drawer">
        <div class="cart-header">
          <div>
            <p class="eyebrow" id="cartEyebrow"></p>
            <h3 id="cartTitle"></h3>
          </div>
          <button id="closeCartBtn" class="icon-btn">×</button>
        </div>

        <div id="cartItems" class="cart-items"></div>

        <div class="cart-footer">
          <div class="total-row">
            <span id="totalLabel"></span>
            <strong id="cartTotal">₪0</strong>
          </div>
          <button id="copyNoteBtn" class="secondary-btn full-width"></button>
          <button id="payWithBitBtn" class="primary-btn full-width"></button>
          <p id="paymentNote" class="payment-note"></p>
        </div>
      </aside>

      <div id="productModal" class="product-modal">
        <div class="product-modal-card">
          <button id="closeModalBtn" class="icon-btn modal-close">×</button>
          <img id="modalImage" class="modal-image" alt="" />
          <div class="modal-body">
            <div class="modal-top">
              <h3 id="modalName"></h3>
              <div class="modal-price" id="modalPrice"></div>
            </div>
            <p id="modalDescription" class="modal-description"></p>
            <button id="modalAddBtn" class="add-btn"></button>
          </div>
        </div>
      </div>

      <div id="overlay" class="overlay"></div>
      <div id="toast" class="toast">Copied</div>

      <a
        id="whatsappWidget"
        class="whatsapp-widget"
        href="#"
        target="_blank"
        rel="noopener"
        aria-label="WhatsApp"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"
          />
        </svg>
      </a>
    </div>

    <script src="app.js"></script>
  </body>
</html>
